# Main workflow, in tiers of cost:
#   unit       (ubuntu, windows)  L0 tsc, L1 unit, L2 contract (mock vs the
#                                 in-process server), L3 integration (temp
#                                 SQLite file, real server process restart).
#   ui         (ubuntu)           L4/L5: Playwright on chromium, webkit and
#                                 firefox against the Vite dev server and the
#                                 labelled mock; ARIA, geometry, pixels.
#   stack      (ubuntu)           L6: the built client served by the real
#                                 server on a temp database, three engines.
#   container  (ubuntu)           L7 analogue: docker build, run, health,
#                                 create/list, restart keeps data, stop.
#   sheet      (ubuntu)           Every real-stack screenshot on one page.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint and types
        run: npm run lint
      - name: Unit (L1)
        run: npm run test:unit
      - name: Contract, mock vs server (L2)
        run: npm run test:contract
      - name: Integration, temp SQLite and server process (L3)
        run: npm run test:integration

  ui:
    name: ui (ubuntu, 3 engines)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Browsers and their system packages come with the image, so there is no
    # apt step to stall (the runner mirror once took 5 min for 10 MB). The tag
    # must equal the locked @playwright/test version; the guard step checks it.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Playwright version matches the image
        shell: bash
        run: |
          want="1.65.0"
          have="$(npx playwright --version | awk '{print $2}')"
          [ "$have" = "$want" ] || { echo "@playwright/test is $have but the job image is v$want; update both together"; exit 1; }
      - name: Playwright (chromium, webkit, firefox against the mock)
        env:
          CI: "1"
        run: npm run test:ui
      - name: Upload report and diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-ubuntu
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  stack:
    name: stack (ubuntu, real server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Browsers and their system packages come with the image, so there is no
    # apt step to stall (the runner mirror once took 5 min for 10 MB). The tag
    # must equal the locked @playwright/test version; the guard step checks it.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Playwright version matches the image
        shell: bash
        run: |
          want="1.65.0"
          have="$(npx playwright --version | awk '{print $2}')"
          [ "$have" = "$want" ] || { echo "@playwright/test is $have but the job image is v$want; update both together"; exit 1; }
      - name: Real stack (built client + server + temp SQLite)
        env:
          CI: "1"
        run: npm run test:e2e
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stack-ubuntu
          path: |
            artifacts/stack
            playwright-report-stack
            test-results-stack
          if-no-files-found: warn
          retention-days: 7

  container:
    name: container (ubuntu, docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build, run, probe, restart, stop
        env:
          LOG_FILE: container.log
        run: bash scripts/container-smoke.sh
      - name: Upload container log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-log
          path: container.log
          if-no-files-found: ignore
          retention-days: 7

  sheet:
    name: contact sheet
    needs: [stack]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: stack-*
          path: shots
      - name: Build the sheet (empty when the stack job produced no screenshots)
        run: |
          mkdir -p shots
          node scripts/contact-sheet.mjs shots contact-sheet.html
      - uses: actions/upload-artifact@v7
        with:
          name: contact-sheet
          path: contact-sheet.html
          retention-days: 14
