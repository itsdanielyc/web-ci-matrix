# Regenerates the pixel baselines (and the shared ARIA and geometry
# snapshots) in the same Playwright image the ci ui job uses, then commits
# them to the dispatching branch or, from main, opens a pull request. Never
# captured on a developer machine: fonts differ. One ubuntu job covers the
# three engines, because CI runs the UI suite on ubuntu only.
name: snapshots

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  capture:
    name: capture (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Browsers and their system packages come with the image, so there is no
    # apt step to stall (the runner mirror once took 5 min for 10 MB). The tag
    # must equal the locked @playwright/test version; the guard step checks it.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Playwright version matches the image
        shell: bash
        run: |
          want="1.65.0"
          have="$(npx playwright --version | awk '{print $2}')"
          [ "$have" = "$want" ] || { echo "@playwright/test is $have but the job image is v$want; update both together"; exit 1; }
      - name: Capture baselines
        env:
          CI: "1"
        run: npm run test:ui:update
      - uses: actions/upload-artifact@v7
        with:
          name: snapshots-ubuntu-latest
          path: tests/ui/__snapshots__
          retention-days: 3

  propose:
    name: commit or open pull request
    needs: [capture]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # By name, not pattern: a pattern that matches a single artifact is
      # extracted straight into path, without the per-artifact folder.
      - uses: actions/download-artifact@v8
        with:
          name: snapshots-ubuntu-latest
          path: incoming
      - name: Merge the capture set
        run: |
          cp -R incoming/. tests/ui/__snapshots__/
          git status --short tests/ui/__snapshots__
      - name: Commit the baselines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add tests/ui/__snapshots__
          if git diff --cached --quiet; then echo "No snapshot changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update visual snapshots from run ${{ github.run_id }}"
          if [ "${{ github.ref_name }}" != "main" ]; then
            # Dispatched on a working branch: land the baselines on that branch,
            # so the pull request that is already open picks them up.
            git push origin "HEAD:${{ github.ref_name }}"
          else
            branch="snapshots/update-${{ github.run_id }}"
            git checkout -b "$branch"
            git push origin "$branch"
            gh pr create --base main --head "$branch" \
              --title "Update visual snapshots (run ${{ github.run_id }})" \
              --body "Baselines captured on ubuntu-latest (chromium, webkit, firefox) by the snapshots workflow. Review the images before merging."
          fi
